<svg xmlns="http://www.w3.org/2000/svg" width="900" height="874" viewBox="0 0 900 874" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="900" height="874" fill="#ffffff"/>
